<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders & Shadows</title>
</head>
<body>
    <!-- 
    =>  Borders & Shadows
        1.  Borders ও Shadows ব্যবহার করে
        2.  box, card, button, text—সবকিছুকে depth ও beauty দেওয়া হয়।

    1.  Border সম্পর্কিত Properties
        1.  border-style:
            =>  Border-এর ধরন নির্ধারণ করে।
            =>  Common values: border-style:
                1.  solid
                2.  dashed
                3.  dotted
                4.  double
                5.  groove
                6.  ridge
                7.  inset
                8.  outset
        2.  border-width
            =>  Border কতটা মোটা হবে।
            =>  values: border-style:
                1.  border-width: 2px;              সব দিক
                2.  border-width: 2px 4px;          top-bottom | left-right
                3.  border-width: 1px 2px 3px;      top | left-right | bottom
                4.  border-width: 1px 2px 3px 4px;  top right bottom left
        3.  border-radius
            =>  Border কে গোলাকার (rounded) করতে ব্যবহার হয়।
            =>  values: border-radius:
                1.  border-width: 2px;              সব দিক
                2.  border-width: 2px 4px;          top-bottom | left-right
                3.  border-width: 1px 2px 3px;      top | left-right | bottom
                4.  border-width: 1px 2px 3px 4px;  top right bottom left

    2.  Shadows সম্পর্কিত Properties
        1.  box-shadow
            =>  Box বা element-এর চারপাশে ছায়া দেয়।
            =>  box-shadow: x-offset y-offset blur spread color;
            =>  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                =>  সবচেয়ে বেশি ব্যবহৃত shadow pattern
            
    
    -->
</body>
</html>
