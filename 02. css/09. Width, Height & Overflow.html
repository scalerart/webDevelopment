<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width, Height & Overflow</title>
</head>
<body>
    <!-- 
    =>  Width, Height & Overflow
        =>  এই টপিকগুলো জানলে
        =>  element এর আকার নিয়ন্ত্রণ,
        =>  content বেশি হলে কী হবে—সব পরিষ্কার হয়ে যায়।

    1.  width & height (সংক্ষেপে)
        =>  Element কতটা জায়গা নেবে।
        =>  Responsive design-এ fixed px কম ব্যবহার করাই ভালো।

    2.  min-width & max-width
        1.  min-width
            =>  Element সবচেয়ে ছোট কতটা হতে পারবে তা নির্ধারণ করে।
        2.  max-width (খুব গুরুত্বপূর্ণ)
            =>  Element সবচেয়ে বড় কতটা হতে পারবে।
            =>  বড় স্ক্রিনে content খুব বেশি ছড়িয়ে যায় না
            =>  Responsive layout-এর heart

    3.  min-height & max-height
        1.  min-height
            =>  Element-এর ন্যূনতম উচ্চতা।
            =>  min-height: 100vh; content কম হলেও section সুন্দর দেখায়।
        2.  max-height
            =>  Element-এর সর্বোচ্চ উচ্চতা।
            =>  max-height: 300px; content বেশি হলে overflow শুরু হবে।

    =>  Overflow (Content বেশি হলে কী হবে)
        =>  Overflow মানে:
        =>  box এর ভিতরের content যদি জায়গার চেয়ে বেশি হয়।

        1.  overflow: hidden
            =>  Extra content লুকিয়ে যায়
            =>  image crop, animation, card design-এ ব্যবহার হয়।
        2.  overflow: scroll
            =>  সবসময় scrollbar দেখায়
            =>  content কম হলেও scrollbar থাকবে।
        3.  overflow: auto (Best)
            =>  প্রয়োজন হলে scrollbar দেখায়।
            =>  clean + user friendly
        4.  Axis অনুযায়ী Overflow
            1.  overflow-x: hidden;
            2.  overflow-y: auto;
                =>  Horizontal scroll বন্ধ রাখতে খুব কাজে লাগে।            
    -->
</body>
</html>
