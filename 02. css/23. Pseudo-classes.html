<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
</head>
<body>
    <!-- 
    =>  Pseudo-classes
        =>  Pseudo-class মানে element-এর একটি নির্দিষ্ট অবস্থা (state) নির্বাচন করা
    1.  :hover
        =>  Element-এর উপর mouse নিলে কাজ করে
        =>  Common uses:
            1.  Button effect
            2.  Link highlight
            3.  Card animation

    2.  :focus
        =>  Input বা element-এ click / tab করলে কাজ করে
        =>  Accessibility-এর জন্য খুব গুরুত্বপূর্ণ

    3.  :active
        =>  Click করার সময় (pressed অবস্থায়) কাজ করে।

    4.  :first-child
        =>  Parent-এর প্রথম child নির্বাচন করে।

    5.  :last-child
        =>  Parent-এর শেষ child নির্বাচন করে।

    6.  :nth-child()
        =>  নির্দিষ্ট pattern অনুযায়ী child নির্বাচন করে।

    7.  Common Patterns
        1.  li:nth-child(odd)   বিজোড়
        2.  li:nth-child(even)  জোড়
        3.  li:nth-child(3n)    প্রতি ৩য়
        4.  li:nth-child(3n+1)
        =>  Table row, list styling এ খুব কাজে লাগে।        
    -->
</body>
</html>
