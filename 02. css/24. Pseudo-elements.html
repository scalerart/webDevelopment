<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-elements</title>
</head>
<body>
    <!-- 
    =>  Pseudo-elements
        =>  Pseudo-element দিয়ে element-এর নির্দিষ্ট অংশ বা ভার্চুয়াল অংশে style দেওয়া যায়

    1.  ::before
        =>  Element-এর আগে (শুরুতে) একটি virtual element যোগ করে।

    2.  ::after
        =>  Element-এর পরে (শেষে) একটি virtual element যোগ করে।
        =>  ::before এবং ::after কাজ করবে না যদি content property না দেওয়া হয়।
    
    3.  content property
        1.  Text যোগ করা
            =>  content: " ★";
        2.  Empty content
            =>  content: "";                    
    -->
</body>
</html>
