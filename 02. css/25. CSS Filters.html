<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
</head>
<body>
    <!-- 
    =>  CSS Filters
        =>  CSS filter দিয়ে element (বিশেষ করে image)-এর
        =>  রং, আলো, sharpness পরিবর্তন করা যায়
        =>  HTML বা image ফাইল বদলাতে হয় না

    1.  filter property
        1.  blur()
            =>  Element ঝাপসা (blur) করে।
            =>  filter: blur(3px);
            =>  মান যত বেশি → blur তত বেশি
        2.  brightness()
            =>  Image কতটা উজ্জ্বল হবে।
            =>  filter: brightness(120%);
                1.  100% = normal
                2.  কমালে অন্ধকার
                3.  বাড়ালে উজ্জ্বল
        3.  contrast()
            =>  Light ও dark এর পার্থক্য বাড়ায়/কমায়।
            =>  filter: contrast(150%);
                1.  100% = normal
                2.  বেশি = sharp look
        4.  grayscale()
            =>  Image সাদা-কালো করে।
            =>  filter: grayscale(100%);
                1.  0% = normal
                2.  100% = পুরো black & white
        5.  Multiple Filters একসাথে
            =>  filter: grayscale(100%) brightness(110%) contrast(120%);
            =>  Order matter করে



    -->
</body>
</html>
