<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
</head>
<body>
    <!-- 
    =>  CSS Gradients
        =>  Gradient মানে এক রঙ থেকে আরেক রঙে ধীরে ধীরে পরিবর্তন
        =>  Gradient হলো image-এর মতো, কিন্তু pure CSS

    1.  linear-gradient
        =>  background: linear-gradient(red, blue);
        =>  উপর থেকে নিচে রঙ বদলাবে (default)
        =>  Direction দেওয়া
            background: linear-gradient(to right, red, blue);
        =>  Direction options:
            1.  to right
            2.  to left
            3.  to top
            4.  to bottom
            5.  45deg, 90deg
        =>  background: linear-gradient(45deg, #ff6a00, #ee0979);

    2.  radial-gradient
        =>  background: radial-gradient(red, blue);
        =>  কেন্দ্র থেকে চারদিকে রঙ ছড়াবে।
        =>  Shape control
            1.  background: radial-gradient(circle, red, blue);
            2.  background: radial-gradient(ellipse, red, blue);
    -->
</body>
</html>
