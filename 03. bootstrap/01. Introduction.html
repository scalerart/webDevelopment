<!-- 
🎬 গল্পের শুরু: একজন ওয়েব ডিজাইনারের সমস্যা
একদিন রুবেল নামে এক তরুণ ওয়েব ডিজাইনার ছিল।
সে প্রতিদিন ক্লায়েন্টের জন্য নতুন ওয়েবসাইট বানাতো — কিন্তু প্রতিবারই CSS লিখে একই ধরনের কাজ করতে করতে ক্লান্ত হয়ে যেত।
যেমন:
    1.  ন্যাভবার সাজানো
    2.  বাটন সুন্দর করা
    3.  লেআউট ঠিক করা
    4.  রেসপন্সিভ করা (মোবাইলেও যেন সুন্দর দেখায়)
রুবেল ভাবলো,
    “যদি এমন কোনো ready-made code থাকতো, যেটা ব্যবহার করলেই ওয়েবসাইট নিজে থেকেই সুন্দর, responsive আর professional হয়ে যেত!” ঠিক তখনই আসে এক যাদুকরী টুল — Bootstrap! 🎩✨

🧠  Bootstrap কী?
    Bootstrap হলো একটি CSS Framework, অর্থাৎ — এটা একধরনের ready-made design toolkit, যেখানে আগেই অনেকগুলো CSS, JavaScript ও HTML কম্পোনেন্ট তৈরি করে রাখা আছে।
    তুমি শুধু সেই কম্পোনেন্টগুলোর নাম ব্যবহার করলেই ওয়েবসাইট নিজে থেকেই সাজানো-গোছানো হয়ে যায়।

⚙️  Bootstrap কীভাবে কাজ করে?
    Bootstrap আসলে তিনটি প্রধান জিনিস নিয়ে কাজ করে👇    
    | অংশ               | ব্যাখ্যা
    | 1. CSS Classes     | আগে থেকেই তৈরি ডিজাইন ক্লাস থাকে যেমন .btn, .text-center, .container, .row, .col-md-6 ইত্যাদি।
    | 2. Grid System     | ১২ কলামের লেআউট সিস্টেম — যেটা ওয়েবসাইটকে রেসপন্সিভ (মোবাইল, ট্যাব, ডেস্কটপে মানিয়ে যায়) করে।
    | 3. JavaScript Plugins | ড্রপডাউন, মডাল, স্লাইডার, ট্যাব ইত্যাদি ইন্টারঅ্যাকটিভ অংশ সহজে তৈরি করা যায়।

🎨  উদাহরণ দিয়ে বোঝা যাক
    ধরো রুবেল একটা বাটন বানাতে চায়।
    আগে সে লিখত:
        button {
        background-color: blue;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        }
    কিন্তু এখন Bootstrap এ সে শুধু লিখবে:
        <button class="btn btn-primary">Click Me</button>
    👉 আর তখনই বাটনটা সুন্দর নীল রঙের, গ্লো করা ডিজাইন হয়ে যাবে।

📱  Bootstrap এর Grid System (সবচেয়ে গুরুত্বপূর্ণ অংশ)
    Bootstrap ওয়েবপেজকে ১২ কলামে ভাগ করে।
    তুমি চাইলে সেই কলামগুলো দিয়ে সুন্দরভাবে লেআউট বানাতে পারো।
        উদাহরণ:
        <div class="container">
        <div class="row">
            <div class="col-md-4">Column 1</div>
            <div class="col-md-4">Column 2</div>
            <div class="col-md-4">Column 3</div>
        </div>
        </div>
    👉 এটি ডেস্কটপে ৩ কলাম দেখাবে, আর মোবাইলে নিচে নিচে এক কলাম করে চলে যাবে — একদম Responsive! 📲

⚙️  Bootstrap এর কিছু জনপ্রিয় ক্লাস    
| উদ্দেশ্য         | ক্লাস নাম                          | কাজ
| -------------- | -------------------------------- | --------------------
| Container      | .container                       | মূল লেআউট ধারণ করে
| Button         | .btn, .btn-primary, .btn-success | বিভিন্ন স্টাইলের বাটন
| Text           | .text-center, .text-end          | টেক্সটের অবস্থান ঠিক করে
| Margin/Padding | .mt-3, .p-4                      | মার্জিন/প্যাডিং বাড়ায়
| Color          | .bg-danger, .text-warning        | ব্যাকগ্রাউন্ড বা টেক্সটের রঙ দেয়
| Grid           | .row, .col-md-6                  | লেআউট ভাগ করে

🧩  Bootstrap কোথায় পাওয়া যায়?
    তুমি দুইভাবে Bootstrap ব্যবহার করতে পারো:
        1.  CDN লিংক ব্যবহার করে (সবচেয়ে সহজ):
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        2.  ডাউনলোড করে নিজের প্রোজেক্টে রেখে ব্যবহার করা

💪  Bootstrap এর সুবিধা
    ✅ ওয়েবসাইট দ্রুত বানানো যায়
    ✅ কোড কম লাগে
    ✅ মোবাইল-ফ্রেন্ডলি (Responsive)
    ✅ ডিজাইন একদম প্রফেশনাল লুক দেয়
    ✅ অনেক রেডি কম্পোনেন্ট (Navbar, Modal, Table ইত্যাদি)

⚠️  কিছু অসুবিধা
    ❌ অনেক ওয়েবসাইটের ডিজাইন দেখতে একরকম লাগে
    ❌ অতিরিক্ত ক্লাস ব্যবহার করলে কোড জটিল হয়ে যায়
    ❌ নিজস্ব কাস্টম ডিজাইন দিতে কিছুটা সময় লাগে    

🎯  উপসংহার (গল্পের শেষ)
    রুবেল এখন Bootstrap ব্যবহার করে মাত্র কয়েক ঘণ্টায় একটা পুরো ওয়েবসাইট বানিয়ে ফেলে।
    তার ওয়েবসাইটগুলো মোবাইল-ফ্রেন্ডলি, ঝকঝকে, এবং প্রফেশনাল দেখায়।
    সে বলে —
        “Bootstrap হলো ওয়েব ডিজাইনারদের জন্য এক রকম ready-made magic box!” ✨
