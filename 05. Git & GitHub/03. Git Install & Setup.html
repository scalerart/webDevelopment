<!-- 
Git Install & Setup

1.  Git Install (Windows)
    Step–1: Git Download
        ✔  ব্রাউজারে যাও
        ✔  লিখো: git download
        ✔  Official site: git-scm.com

    =>  ডাউনলোড শেষে

    Step–2: Install করার সময় কী করবে?
        ✔  সব জায়গায় Next → Next → Next
        ✔  Default settings রাখলেই ঠিক আছে
        ✔  শেষ হলে Finish

    =>  ভয় পাওয়ার কিছু নেই, আমরা Advanced setting পরে শিখবো

2.  Git ঠিকভাবে Install হয়েছে কিনা চেক করবো
    ✔  Command Prompt / PowerShell খুলে লিখো:
        git --version

    ✔  Output যদি এমন আসে:
        git version 2.xx.x

    =>  তাহলে Git সফলভাবে install হয়েছে

3.  Git Configuration (খুব গুরুত্বপূর্ণ)
    Git কে বলতে হবে:
        ✔  তুমি কে?
        ✔  তোমার নাম কী?
        ✔  তোমার ইমেইল কী?
        =>  কারণ Git প্রতিটা commit এ এই নাম রাখবে

    1.  Name সেট করো
        git config --global user.name "তোমার নাম"
        ✔  git config --global user.name "Abdul Kadir"

    2.  Email সেট করো
        git config --global user.email "youremail@gmail.com"
        ✔  এই ইমেইল GitHub account এর ইমেইল হওয়া ভালো

    3.  Check করো সব ঠিক আছে কিনা
        git config --global --list

    =>  তুমি দেখতে পাবে:
        user.name
        user.email

4.  Global vs Local Config
    1.  Global Config
        ✔  সব project এর জন্য এক
        ✔  একবার সেট করলেই যথেষ্ট

    2.  Local Config
        ✔  নির্দিষ্ট project এর জন্য
        ✔  Team project এ দরকার হয়

    =>  আপাতত Global config ই যথেষ্ট

5.  Git Bash কী?
    Git install করলে নতুন একটা জিনিস আসবে: Git Bash

    =>  এটা দিয়ে:
        ✔  Linux-like command
        ✔  Git command
        ✔  Easy workflow

    =>  এখন থেকে আমরা Git Bash ব্যবহার করবো

6.  First Git Test (Mini Test)
    Git Bash খুলে লিখো:
        git help
    যদি help menu আসে তুমি পুরোপুরি প্রস্তুত

=>  Lesson Summary
    1.  Git install করা
    2.  Git version check
    3.  Name & Email set
    4.  Git Bash ব্যবহার
    5.  Git ready check
