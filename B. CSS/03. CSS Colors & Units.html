    <title>CSS Colors & Units</title>

<body>
    

    <!-- 
    =>  CSS Units মোট দুই ধরনের—
        1.  Absolute Units
        2.  Relative Units

        1.  Absolute Units (নির্দিষ্ট বা স্থির ইউনিট)
            এগুলো Fixed। স্ক্রিন ছোট–বড় হলেও পরিবর্তন হয় না।

            Absolute Units তালিকা:
            1.  px → Pixels
            2.  cm → Centimeters
            3.  mm → Millimeters
            4.  in → Inches
            5.  pt → Points
            6.  pc → Picas

            বর্তমানে সবচেয়ে বেশি ব্যবহৃত absolute unit হলো px
    
        2.  Relative Units (আপেক্ষিক বা পরিবর্তনশীল ইউনিট)
            Parent, root font-size বা device screen এর উপর নির্ভর করে পরিবর্তিত হয়।
            Responsive design-এর জন্য গুরুত্বপূর্ণ।

            Relative Units তালিকা:
            1.  % → Parent এর শতকরা অংশ
            2.  em → Parent font-size এর উপর নির্ভর
            3.  rem → Root (html) font-size এর উপর নির্ভর
            4.  vh → Viewport height (স্ক্রিন উচ্চতার %)
            5.  vw → Viewport width (স্ক্রিন প্রস্থের %)
            6.  vmin → viewport-এর ছোট দিকের %
            7.  vmax → viewport-এর বড় দিকের %
            8.  ex → x-height (খুব কম ব্যবহৃত)
            9.  ch → character width
            10.  lh → line height

            Responsive design–এ সবচেয়ে বেশি ব্যবহৃত relative units হলো: %, em, rem, vh, vw

    *** CSS Colors & Units
        1.  Colors in CSS
            CSS এ রং সেট করার অনেক উপায় আছে। প্রধান চারটি হলো:
            1.  Color Name
                সরাসরি রঙের নাম ব্যবহার করা হয়।
                উদাহরণ: red, blue, green, orange
                p {
                    color: red;
                }                

            2.  Hexadecimal (Hex)
                # দিয়ে শুরু হয়, পরে ৬টি হেক্সাডেসিমাল সংখ্যা/অক্ষর (0–9, A–F)
                প্রথম ২টি = Red, মাঝের ২টি = Green, শেষ ২টি = Blue
                p {
                    color: #FF5733; /* লাল-মরুনের মিশ্রণ */
                }                
                
            3.  RGB (Red, Green, Blue)
                রঙের মান 0–255 পর্যন্ত
                p {
                    color: rgba(255, 87, 51, 0.5); /* 50% transparent */
                }                

            4.  HSL (Hue, Saturation, Lightness)
                Hue: রঙের কোণ (0–360)
                Saturation: রঙের তীব্রতা (%)
                Lightness: উজ্জ্বলতা (%)
                p {
                    color: hsl(14, 100%, 60%);
                }
    -->
</body>
</html>
