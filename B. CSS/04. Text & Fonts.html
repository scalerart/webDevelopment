<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text & Fonts</title>
</head>
<body>
    <!-- 
    =>  Text & Fonts
    1.  color, font-size, font-family
        1.  color - লেখার রং পরিবর্তন করতে ব্যবহৃত হয়।
            =>  Color formats: name, hex, rgb, hsl
        2.  font-size - লেখার সাইজ নিয়ন্ত্রণ করে।
            =>  ইউনিট হিসেবে px, em, rem বেশি ব্যবহৃত হয়।
        3.  font-family - লেখায় কোন ফন্ট ব্যবহার হবে তা নির্ধারণ করে।
            =>  font-family: "Roboto", Arial, sans-serif;
            =>  সবসময় শেষে fallback font দিতে হবে (যেমন sans-serif)। যদি প্রথম ফন্ট লোড না হয় তাহলে দ্বিতীয়টি কাজ করবে।
    
    2.  font-weight, font-style, text-align
        1.  font-weight - লেখার মোটা–পাতলা (boldness) নিয়ন্ত্রণ করে।
            =>  Value:
                1.  normal
                2.  bold
                3.  100 → 900 পর্যন্ত numbers
        2.  font-style - লেখা সামান্য হেলানো (italic) বা normal করতে ব্যবহৃত হয়।
            =>  Value:
                1.  normal
                2.  italic
                3.  oblique
        3.  text-align - লেখা কোনদিকে সাজানো হবে তা নিয়ন্ত্রণ করে।
            =>  Value:
                1.  left
                2.  right
                3.  center
                4.  justify (লাইন সমান করে সাজায়)

    3.  text-transform, text-decoration, line-height
        1.  text-transform - লেখাকে uppercase/lowercase/ capitalize করতে ব্যবহার হয়।
            =>  Value:
                1.  uppercase → সব বড় অক্ষর
                2.  lowercase → সব ছোট
                3.  capitalize → প্রতিটি শব্দের প্রথম অক্ষর বড়
        2.  text-decoration - লেখার নিচে/উপরে দাগ (underline, overline) বা line-through দিতে ব্যবহৃত হয়।
            =>  Common values:
                1.  none
                2.  underline
                3.  line-through
                4.  overline
        3.  line-height - দুই লাইনের মধ্যে দূরত্ব (line spacing) নিয়ন্ত্রণ করে।
            =>  Responsive typography-র জন্য খুব গুরুত্বপূর্ণ।
            =>  Best practice:
                1.  1.4 – 1.8 → paragraph এর জন্য ideal
                2.  px, em, number — সব units ব্যবহার করা যায়
    -->
</body>
</html>
