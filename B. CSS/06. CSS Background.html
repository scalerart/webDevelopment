<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background</title>
</head>
<body>
    <!-- 
    =>  CSS Background
        Background ব্যবহার করে আমরা section, div, body, banner, card—সবকিছুকে সুন্দর করি।

        1.  background-color
            =>  Element-এর পেছনের রং সেট করে।
            =>  color name, hex, rgb, hsl—সবই ব্যবহার করা যায়।

        2.  background-image
            =>  Element-এর পেছনে ছবি বসাতে ব্যবহার হয়।
            =>  সাধারণত hero section, banner, cover design-এ ব্যবহার হয়।

        3.  background-size
            =>  Background image কিভাবে size হবে তা নির্ধারণ করে।
            =>  Values: background-size:
                1.  cover
                    =>  পুরো container ঢেকে ফেলে
                    =>  ছবি কিছু অংশ crop হতে পারে
                2.  contain
                    =>  পুরো ছবি দেখা যায়
                    =>  ফাঁকা জায়গা থাকতে পারে
                3.  custom size

        4.  background-repeat
            =>  Background image repeat হবে কিনা।
            =>  Values: background-repeat:
                1.  repeat (default)
                2.  no-repeat
                3.  repeat-x
                4.  repeat-y
            =>  বেশিরভাগ সময় no-repeat ব্যবহার হয়।                

        5.  background-position
            =>  Background image কোথায় বসবে তা নির্ধারণ করে।
            =>  Common values: background-position:
                1.  center
                2.  top right
            =>  hero section এর জন্য সবচেয়ে জনপ্রিয়:
                1.  background-position: center center;

        6.  background-attachment
            =>  Background image স্ক্রল করলে কি হবে তা নিয়ন্ত্রণ করে।
            =>  Values: background-attachment:
                1.  scroll (default)
                    =>  স্ক্রলের সাথে image নড়বে
                2.  fixed
                    =>  image স্থির থাকবে
                    =>  সুন্দর parallax effect তৈরি হয়
        </body>
    -->
</html>
