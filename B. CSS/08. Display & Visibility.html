<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display & Visibility</title>
</head>
<body>
    <!-- 
    =>  Display & Visibility
        HTML-এর প্রতিটি element স্ক্রিনে কিভাবে দেখাবে এবং কত জায়গা নেবে—এটাই নিয়ন্ত্রণ করে display ও visibility।

    1.  display: block
        =>  বৈশিষ্ট্য
            1.  পুরো লাইনের জায়গা নেয়
            2.  নতুন লাইনে শুরু হয়
            3.  width / height কাজ করে

    2.  display: inline
        =>  বৈশিষ্ট্য
            1.  শুধু content যতটুকু লাগে ততটুকু জায়গা নেয়
            2.  একই লাইনে থাকে
            3.  width / height কাজ করে না

    3.  display: inline-block
        =>  বৈশিষ্ট্য
            1.  inline এর মতো একই লাইনে থাকে
            2.  block এর মতো width / height কাজ করে ✅
            3.  margin / padding পুরোপুরি কাজ করে
            =>  সবচেয়ে ব্যবহারযোগ্য

    4.  display: none
        =>  কী করে?
            1.  Element সম্পূর্ণভাবে লুকিয়ে ফেলে
            2.  কোনো জায়গা নেয় না
            3.  DOM এ থাকে, কিন্তু দেখা যায় না

    5.  visibility: hidden
        =>  কী করে?
            1.  Element দেখা যায় না
            2.  কিন্তু জায়গা রেখে দেয়
            =>  Layout ভাঙবে না, শুধু element অদৃশ্য হবে।

    6.  visibility: visible
        =>  Default value—element দেখা যায়।            
    -->
</body>
</html>
