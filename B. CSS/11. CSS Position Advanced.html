<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Advanced</title>
</head>
<body>
    <!-- 
    =>  CSS Position Advanced
    1.  z-index
        1.  z-index কী?
            =>  z-index দিয়ে নির্ধারণ করা হয় কোন element সবার উপরে থাকবে (layer order)
            =>  যার z-index বেশি, সে উপরে থাকবে।
        2.  কখন কাজ করে?
            =>  position: relative | absolute | fixed | sticky
            =>  static এ কাজ করে না।
        3.  Value কেমন হয়?
            =>  Integer number
            =>  Negative value ব্যবহার করা যায়

    2.  position: sticky
        1.  sticky কী?
            =>  relative + fixed এর মিশ্রণ
            =>  কিভাবে কাজ করে?
                1.  প্রথমে relative এর মতো থাকে
                2.  Scroll করলে নির্দিষ্ট জায়গায় গিয়ে fixed হয়ে যায়
                3.  Header, menu, sidebar এর জন্য পারফেক্ট

        2.  Important Rules
            =>  অবশ্যই top / bottom / left / right দিতে হবে
            =>  Parent এর ভিতরে কাজ করে
            =>  Parent এ overflow: hidden থাকলে কাজ নাও করতে পারে
    -->
</body>
</html>
