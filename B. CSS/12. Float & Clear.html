<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float & Clear</title>
</head>
<body>
    <!-- 
    =>  Float & Clear
        =>  float মূলত text এর পাশে image বসানোর জন্য বানানো হয়েছিল কিন্তু পরে এটা দিয়ে পুরো layout বানানো হতো।

    1.  float property
        1.  float: left
            =>  Element বাম দিকে সরে যায়।
        2.  float: right
            =>  Element ডান দিকে সরে যায়।
        3.  float: none (Default)
            =>  Normal অবস্থায় থাকে।
        4.  Float হলে কী ঘটে?
            1.  Element normal flow থেকে বের হয়ে যায়
            2.  Parent এর height অনেক সময় collapse হয়ে যায় ❌
            3.  Text element এর চারপাশে wrap করে

    2.  clear property
        =>  clear ব্যবহার করা হয় float এর প্রভাব বন্ধ করার জন্য।
        1.  clear: left
            =>  left float-এর নিচে যাবে।
        2.  clear: right
            =>  left + right দুইটাই clear করে।            
    -->
</body>
</html>
