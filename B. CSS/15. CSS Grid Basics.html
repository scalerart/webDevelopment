<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Basics</title>
</head>
<body>
    <!-- 
    =>  CSS Grid Basics
        1.  CSS Grid হলো দুই-মাত্রিক (2D) layout system
        2.  Row + Column একসাথে কন্ট্রোল করা যায়

    1.  display: grid
        =>  Grid চালু করার জন্য parent element-এ লিখতে হয়:
        =>  Child গুলো হয়ে যায় grid items

    2.  grid-template-columns
        =>  Column কয়টা হবে এবং কত চওড়া হবে।
        =>  Common Values:
            1.  grid-template-columns: repeat(3, 1fr);
            2.  grid-template-columns: 1fr 2fr;
            3.  grid-template-columns: auto auto auto;

    3.  grid-template-rows
        =>  Row কয়টা হবে এবং height কেমন হবে।
        =>  Values:
            1.  grid-template-rows: 100px auto;

    4.  fr unit (Grid magic)
        =>  grid-template-columns: 1fr 2fr;
        =>  Space কে ভাগ করে নেয় proportion অনুযায়ী

    5.  gap
        =>  Row ও Column এর মাঝে space দেয়।
        =>  Values:
            1.  gap: 20px;
            2.  row-gap: 10px;
            3.  column-gap: 20px;

    6.  grid-area
        =>  Grid item কোথায় বসবে সেটি নিয়ন্ত্রণ করে।
        1.  Method–1 (Line-based)
            =>  grid-area: 1 / 1 / 3 / 3;
            =>  row-start / column-start / row-end / column-end
        2.  Method–2 (Named Areas)
            =>  grid-template-areas:
                1.  header header
                2.  sidebar content
                3.  footer footer;
            =>  .header {grid-area: header;}
            =>  .sidebar {grid-area: sidebar;}
            =>  .content {grid-area: content;}
            =>  .footer {grid-area: footer;}
            =>  সবচেয়ে readable ও clean way
    -->
</body>
</html>
