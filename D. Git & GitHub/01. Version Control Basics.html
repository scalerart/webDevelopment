Version Control, Git & GitHub 

1.  Version Control কী?
    =>  ধরো তুমি একটি ফাইল বানালে
        project.html

    =>  তারপর পরিবর্তন করলে
        project-final.html

    =>  আবার পরিবর্তন
        project-final-last.html

    ✔  কিছুদিন পর বুঝতেই পারছো না—
            1.  কোনটা আসল?
            2.  কোথায় কী বদলেছিলে?
            3.  আগের ভার্সনে ফিরতে চাইলে কী করবে?
        এই সমস্যার সমাধানই Version Control System (VCS)

    ✔  Version Control মানে:
        কোডের সব পরিবর্তনের হিসাব রাখা, কখন কী বদলালে, কে বদলালো, দরকার হলে আগের অবস্থায় ফিরে যাওয়া।

2.  Git কী?
    Git হলো একটা Version Control Software

    ✔  এটা তোমার কম্পিউটারে থাকে
    ✔  ইন্টারনেট ছাড়াও কাজ করে
    ✔  কোডের প্রতিটা পরিবর্তন ট্র্যাক করে

    সহজ ভাষায়: Git = তোমার কোডের “টাইম মেশিন” ভুল হলে? ১ সেকেন্ডে আগের অবস্থায় ফিরে যেতে পারো

3.  GitHub কী?
    এখন ধরো—
        ✔  Git দিয়ে তুমি নিজের কম্পিউটারে কোড রাখছো
        ✔  কিন্তু টিমে কাজ করবে
        ✔  কোড অনলাইনে রাখতে চাও
        ✔  অন্যরা তোমার কোড দেখুক
    =>  এখানেই আসে GitHub

    =>  GitHub মানে: Git দিয়ে বানানো কোডের অনলাইন বাড়ি
        ✔  Code store
        ✔  Team collaboration
        ✔  Project showcase
        ✔  Job portfolio

4.  Git vs GitHub (খুব গুরুত্বপূর্ণ)
    বিষয়     Git                 GitHub
    কী       Software            Website / Platform
    কাজ      Version control	Code hosting
    ইন্টারনেট  লাগে না	           লাগে
    ব্যবহার    Local machine      Online

    ✔  Git ছাড়া GitHub অচল
    ✔  কিন্তু Git একাই চলতে পারে

5.  Local Repository vs Remote Repository
    1.  Local Repository
        ✔  তোমার নিজের কম্পিউটারে
        ✔  Git দিয়ে manage করা
        ✔  Offline কাজ করা যায়

    2.  Remote Repository
        ✔  GitHub এ থাকে
        ✔  Online
        ✔  Team access

    =>  Local → GitHub → Local

6.  Repository কী?
    Repository মানে: একটা প্রজেক্টের পুরো ফোল্ডার যেখানে কোড + ইতিহাস সব থাকে

    =>  একটা Repo-তে থাকে:
        ✔  HTML / CSS / JS
        ✔  Images
        ✔  README.md
        ✔  Git history

7.  Git কীভাবে কাজ করে? (Core Concept)
    =>  Git এর ৩টা জায়গা আছে:
        Working Directory → Staging Area → Repository

    1.  Working Directory
        ✔  যেখানে তুমি কোড লেখো

    2.  Staging Area
        ✔  Git কে বলো: “এই ফাইলগুলো save করার জন্য ready”

    3.  Repository
        ✔  Permanently save (commit)
