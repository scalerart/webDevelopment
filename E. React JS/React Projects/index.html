<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 18px;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: 'Poppins', sans-serif;
        }

        .input-box {
            position: relative;
            width: 250px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 2px solid #38bdf8;
            outline: none;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
        }

        label {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #94a3b8;
            pointer-events: none;
            background-color: #0f172a;
            padding: 0 5px;
            transition: 0.3s;
        }

        input:focus+label,
        input:valid+label {
            top: -8px;
            font-size: 12px;
            color: #38bdf8;
        }

        button{
            width: 250px;
            font-size: 18px;
            text-align: center;
            display: flex;
            align-content: center;
            justify-content: center;
            padding: 12px;
            background-color: #38bdf8;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="input-box">
        <input type="text" name="" id="" required>
        <label for="">Username</label>
    </div>
    <div class="input-box">
        <input type="text" name="" id="" required>
        <label for="">Password</label>
    </div>
    <button>Log In</button>
</body>

</html>
