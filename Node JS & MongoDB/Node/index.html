<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <h1>This is my first Node JS Projects</h1>
    <h2 id="userName"></h2>

    <div class="container">
        <div class="row">
            <input type="text" id="user" class="form-control">
            <button id="addUser" class="btn btn-primary mt-3 ">Add User</button>
        </div>
    </div>

    <script>

        fetch(`http://localhost:3000/users`)
            .then(res => res.json())
            .then(data => {
                const userName = document.getElementById('userName');
                data.map(user => userName.innerText = user?.name)
            })

        // Post data to the server
        const btnAddUser = document.getElementById('addUser');
        btnAddUser.addEventListener('click', () => {
            const name = document.getElementById('user').value;
            const user = { name };

            // Post
            fetch('http://localhost:3000/addUser', {
                method: 'POST',
                body: JSON.stringify(user),
                headers: {
                    'Content-type': 'application/json; charset=UTF-8',
                },
            })
                .then(res => res.json)
                .then(data => updateUser(data))
        })

        const updateUser = (user) => {
            const userName = document.getElementById('userName').innerText = user.name;
            console.log(user);
        }
    </script>
</body>

</html>
